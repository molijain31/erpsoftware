<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                <h4 class="mb-0 text-white font-weight-bold" style="letter-spacing: 0.3px;">
                    <i class="typcn typcn-archive mr-2" style="font-size: 1.3rem; vertical-align: middle;"></i>
                    Current Stock List
                </h4>
            </div>

            <div class="card-body p-4">
                <div class="table-responsive">
                    <table id="dataTable" class="table table-hover table-bordered mb-0" style="font-size: 13.5px; border: 1px solid #e2e8f0;">
                        <thead style="background: #f8fafc; color: #475569; border-bottom: 2px solid #cbd5e1;">
                        <tr>
                            <th style="font-weight: 700; color: #334155;">Item Name</th>
                            <th class="text-center" style="font-weight: 700; color: #334155;">Current Stock</th>
                            <th class="text-center" style="font-weight: 700; color: #334155;">Entry Date</th>
                            <th class="text-center" style="font-weight: 700; color: #334155;">Last Modified</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="stock : ${stocks}" th:if="${not #lists.isEmpty(stocks)}">
                            <td style="font-weight: 700; color: #0f172a;" th:text="${stock.item != null ? stock.item.itemName : stock.itemId}"></td>
                            <td class="text-center font-weight-bold" style="color: #15803d;" th:text="${stock.currentStock}"></td>
                            <td class="text-center" style="color: #475569;" th:text="${stock.entryDate != null ? #dates.format(stock.entryDate, 'dd-MMM-yyyy') : ''}"></td>
                            <td class="text-center" style="color: #475569;" th:text="${stock.modifiedDate != null ? #dates.format(stock.modifiedDate, 'dd-MMM-yyyy') : ''}"></td>
                        </tr>
                        <!-- Show if no records -->
                        <tr th:if="${#lists.isEmpty(stocks)}">
                            <td colspan="4" class="text-center text-muted py-4">
                                No records found.
                            </td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr class="font-weight-bold" style="background-color: #f8fafc; color: #0f172a;">
                            <td>Total</td>
                            <td class="text-center font-weight-bold" style="color: #15803d; font-size: 1.05rem;" th:text="${totalStock != null ? totalStock : '0.0'}"></td>
                            <td></td>
                            <td></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
