<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                <h4 class="mb-0 text-white font-weight-bold" style="letter-spacing: 0.3px;">
                    <i class="typcn typcn-th-list mr-2" style="font-size: 1.3rem; vertical-align: middle;"></i>
                    Vendor List
                </h4>
                <a th:href="@{/vendors/new}" class="btn btn-sm text-white font-weight-bold" style="background: #10b981; border: none; padding: 6px 16px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.25);">
                    <i class="typcn typcn-plus"></i> Add Vendor
                </a>
            </div>

            <div class="card-body p-4">
                <div class="table-responsive">
                    <table id="dataTable" class="table table-hover table-bordered mb-0" style="font-size: 13.5px; border: 1px solid #e2e8f0;">
                        <thead style="background: #f8fafc; color: #475569; border-bottom: 2px solid #cbd5e1;">
                        <tr>
                            <th class="text-center" style="width: 50px; font-weight: 700; color: #334155; white-space: nowrap;">S.No</th>
                            <th style="font-weight: 700; color: #334155; white-space: nowrap;">Vendor Name</th>
                            <th style="font-weight: 700; color: #334155; white-space: nowrap;">Contact Person 1</th>
                            <th style="font-weight: 700; color: #334155; white-space: nowrap;">Mobile 1</th>
                            <th style="font-weight: 700; color: #334155; white-space: nowrap;">Email</th>
                            <th style="font-weight: 700; color: #334155; white-space: nowrap;">GST No</th>
                            <th class="text-center" style="width: 100px; font-weight: 700; color: #334155; white-space: nowrap;">Items</th>
                            <th class="text-center no-sort" style="width: 140px; font-weight: 700; color: #334155; white-space: nowrap;">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v, vStat : ${vendors}" th:if="${not #lists.isEmpty(vendors)}">
                            <td class="text-center font-weight-bold" style="color: #64748b; white-space: nowrap;" th:text="${vStat.count}"></td>
                            <td style="font-weight: 700; color: #0f172a; white-space: nowrap;" th:text="${v.vendorName}"></td>
                            <td style="color: #334155;" th:text="${v.contactPerson1}"></td>
                            <td style="color: #334155;" th:text="${v.mobile1}"></td>
                            <td style="color: #334155;" th:text="${v.email}"></td>
                            <td style="color: #334155;" th:text="${v.gstNo}"></td>
                            <td class="text-center">
                                <a th:href="@{/vendors/edit/{id}(id=${v.vendorId})}"
                                   th:text="${v.activeMappingsCount + ' Items'}"
                                   class="badge"
                                   style="background: #e2e8f0; color: #1e293b; font-weight: 700; padding: 5px 10px; border-radius: 6px;"
                                   title="View/Edit Mapped Items"></a>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center align-items-center">
                                    <a th:href="@{/vendors/edit/{id}(id=${v.vendorId})}" class="btn btn-sm text-white font-weight-bold mr-2" style="background: #3b82f6; border: none; padding: 5px 12px; border-radius: 6px; box-shadow: 0 2px 4px rgba(59,130,246,0.25);" title="Edit">
                                        <i class="typcn typcn-edit"></i> Edit
                                    </a>
                                    <a th:href="@{/vendors/delete/{id}(id=${v.vendorId})}"
                                       class="btn btn-sm text-white font-weight-bold" style="background: #ef4444; border: none; padding: 5px 12px; border-radius: 6px; box-shadow: 0 2px 4px rgba(239,68,68,0.25);"
                                       title="Delete"
                                       onclick="return confirm('Are you sure you want to delete this record?')">
                                        <i class="typcn typcn-trash"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>

                        <!-- Show if no records -->
                        <tr th:if="${#lists.isEmpty(vendors)}">
                            <td colspan="8" class="text-center text-muted py-4">No records found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
