<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">
  <div class="row">
    <div class="col-md-12 grid-margin stretch-card">
      <div class="card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
          <h4 class="mb-0 text-white font-weight-bold" style="letter-spacing: 0.3px;">
            <i class="typcn typcn-document-add mr-2" style="font-size: 1.3rem; vertical-align: middle;"></i>
            Type Master Form
          </h4>
          <a th:href="@{/types}" class="btn btn-sm font-weight-bold" style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 6px;">
            <i class="typcn typcn-arrow-left"></i> Back to List
          </a>
        </div>
        <div class="card-body p-4">
          <form class="forms-sample" th:action="@{/types/save}" th:object="${type}" method="post">

            <input type="hidden" th:field="*{typeId}">

            <div class="row">
              <!-- Left Column -->
              <div class="col-md-6">
                <!-- Type Name -->
                <div class="form-group row align-items-center mb-3">
                  <label for="typeName" class="col-4 col-form-label font-weight-bold text-dark" style="font-size: 13.5px;">Type Name <span class="text-danger">*</span></label>
                  <div class="col-8">
                    <input type="text" class="form-control form-control-sm font-weight-bold" style="border: 1px solid #cbd5e1; border-radius: 6px;" id="typeName" th:field="*{typeName}" placeholder="Enter Type Name" required="required">
                  </div>
                </div>
              </div>

              <!-- Right Column -->
              <div class="col-md-6">
                <!-- Status Checkbox -->
                <div class="form-group row align-items-center mb-3">
                  <label class="col-4 col-form-label font-weight-bold text-dark" style="font-size: 13.5px;">Status</label>
                  <div class="col-8">
                    <div class="form-check form-check-flat form-check-primary mb-0 mt-0">
                      <label class="form-check-label font-weight-bold text-dark">
                        <input type="checkbox" class="form-check-input" name="isValid" value="1"
                               th:checked="${type.isValid == null or type.isValid == 1}">
                        Is Active
                        <i class="input-helper"></i>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex align-items-center pt-2">
              <button type="submit" class="btn text-white font-weight-bold mr-2" style="background: #10b981; border: none; padding: 9px 20px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.25);">
                <i class="typcn typcn-tick"></i> Save
              </button>
              <a th:href="@{/types}" class="btn text-white font-weight-bold mr-2" style="background: #64748b; border: none; padding: 9px 20px; border-radius: 6px;">
                <i class="typcn typcn-arrow-left"></i> Back to List
              </a>
              <button type="reset" class="btn font-weight-bold" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 9px 20px; border-radius: 6px;">Reset</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</html>
