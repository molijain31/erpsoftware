<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">
    <style>
        .co-link {
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.15s ease, text-decoration 0.15s ease;
        }
        .co-link:hover {
            color: #4f46e5;
            text-decoration: underline;
        }
    </style>

    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                <h4 class="mb-0 text-white font-weight-bold" style="letter-spacing: 0.3px;">
                    <i class="typcn typcn-th-list mr-2" style="font-size: 1.3rem; vertical-align: middle;"></i>
                    Receive Payment List
                </h4>
            </div>

            <div class="card-body p-4">
                <!-- Success & Error Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="table-responsive">
                    <table id="dataTable" class="table table-hover table-bordered mb-0" style="font-size: 13.5px; border: 1px solid #e2e8f0;">
                        <thead style="background: #f8fafc; color: #475569; border-bottom: 2px solid #cbd5e1;">
                        <tr>
                            <th style="font-weight: 700; color: #334155; white-space: nowrap;">Vendor Name</th>
                            <th class="text-center" style="width: 130px; font-weight: 700; color: #334155; white-space: nowrap;">Last Mod.Date</th>
                            <th class="text-right" style="width: 140px; font-weight: 700; color: #334155; white-space: nowrap;">Last Mod.Paid</th>
                            <th class="text-right" style="width: 140px; font-weight: 700; color: #334155; white-space: nowrap;">Pending Amount</th>
                            <th class="text-center" style="font-weight: 700; color: #334155; white-space: nowrap;">CO Order</th>
                            <th class="text-center" style="width: 100px; font-weight: 700; color: #334155; white-space: nowrap;">Status</th>
                            <th class="text-center no-sort" style="width: 210px; font-weight: 700; color: #334155; white-space: nowrap;">Action</th>
                        </tr>
                        </thead>
                        <tbody>

                        <tr th:each="a, aStat : ${accounts}" th:if="${not #lists.isEmpty(accounts)}">
                            <td style="font-weight: 700; color: #0f172a; white-space: nowrap;">
                                <span style="white-space: nowrap;" th:text="${a.supplierName != null and a.supplierName != '' and a.supplierName != 'null' ? a.supplierName : (a.accountName != null and a.accountName != '' ? a.accountName : 'Supplier #' + (a.supplierId != null ? a.supplierId : a.accountId))}"></span>
                            </td>
                            <td class="text-center" style="color: #475569; white-space: nowrap;" th:text="${a.modifiedDate != null} ? ${#dates.format(a.modifiedDate, 'dd-MMM-yyyy')} : '-'"></td>
                            <td class="text-right font-weight-bold" style="white-space: nowrap; color: #15803d;"
                                th:text="${a.amountReceived != null} ? '₹' + ${#numbers.formatDecimal(a.amountReceived, 1, 2)} : '₹0.00'"></td>
                            <td class="text-right font-weight-bold" style="white-space: nowrap;"
                                th:styleappend="${a.pendingAmount != null and a.pendingAmount > 0} ? 'color: #dc2626;' : 'color: #475569;'"
                                th:text="${a.pendingAmount != null} ? '₹' + ${#numbers.formatDecimal(a.pendingAmount, 1, 2)} : '₹0.00'"></td>
                            <td class="text-center" style="color: #334155; white-space: nowrap; max-width: 280px;">
                                <span th:if="${a.coLinks == null or a.coLinks == ''}">-</span>
                                <span th:if="${a.coLinks != null and a.coLinks != ''}"
                                      th:utext="${a.coLinks}"></span>
                            </td>
                            <td class="text-center" style="white-space: nowrap;">
                                <span th:if="${a.isValid != null and a.isValid == 1}" class="badge" style="background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; font-weight: 600; padding: 5px 12px; border-radius: 6px;">Active</span>
                                <span th:if="${a.isValid == null or a.isValid != 1}" class="badge" style="background-color: #ffe4e6; color: #be123c; border: 1px solid #fecdd3; font-weight: 600; padding: 5px 12px; border-radius: 6px;">Inactive</span>
                            </td>
                            <td class="text-center" style="white-space: nowrap;">
                                <div class="d-flex justify-content-center align-items-center">
                                    <a th:href="@{/supplier-accounts/view/supplier/{supplierId}(supplierId=${a.supplierId})}"
                                       class="btn btn-sm text-white font-weight-bold mr-2"
                                       style="background: #3b82f6; border: none; padding: 6px 14px; border-radius: 6px; box-shadow: 0 2px 4px rgba(59,130,246,0.25);"
                                       title="View Details">
                                        <i class="typcn typcn-eye"></i> View
                                    </a>
                                    <!-- Receive button when NOT fully paid -->
                                    <a th:if="${a.isFullyPaid == null or a.isFullyPaid == false}"
                                       th:href="@{/supplier-accounts/new(supplierId=${a.supplierId})}"
                                       class="btn btn-sm text-white font-weight-bold"
                                       style="background: #10b981; border: none; padding: 6px 14px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.25);"
                                       title="Receive Payment">
                                        <i class="typcn typcn-credit-card"></i> Receive
                                    </a>
                                    <!-- Fully Paid button when fully paid — still clickable, opens form -->
                                    <a th:if="${a.isFullyPaid != null and a.isFullyPaid == true}"
                                       th:href="@{/supplier-accounts/new(supplierId=${a.supplierId})}"
                                       class="btn btn-sm text-white font-weight-bold"
                                       style="background: #10b981; border: none; padding: 6px 14px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.25);"
                                       title="View / Receive Payment">
                                        <i class="typcn typcn-tick"></i> Fully Paid
                                    </a>
                                </div>
                            </td>
                        </tr>

                        <!-- Show if no records -->
                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="7" class="text-center text-muted py-4">
                                No records found. Click "Receive" to create a new record.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Challan Order (CO) Details Modal -->
    <div class="modal fade" id="coDetailsModal" tabindex="-1" role="dialog" aria-labelledby="coDetailsModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document" style="max-width: 950px; width: 90vw;">
            <div class="modal-content" style="border-radius: 10px; overflow: hidden; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
                <div class="modal-header text-white" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                    <div class="d-flex align-items-center">
                        <i class="typcn typcn-document-text mr-2" style="font-size: 1.4rem;"></i>
                        <h5 class="modal-title font-weight-bold text-white mb-0" id="coDetailsModalTitle" style="letter-spacing: 0.3px;">Challan Order Details</h5>
                    </div>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="opacity: 0.9;">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-left p-4" id="coDetailsModalBody">
                    <div class="text-center text-muted py-4">
                        <i class="typcn typcn-arrow-sync mr-2"></i> Loading challan order details...
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between align-items-center" style="background: #f8fafc; border-top: 1px solid #cbd5e1; padding: 12px 24px;">
                    <button type="button" class="btn text-white font-weight-bold" style="background: #10b981; border: none; padding: 7px 20px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.25);" onclick="printCODetailsModal()">
                        <i class="typcn typcn-printer mr-1"></i> Print
                    </button>
                    <button type="button" class="btn text-white font-weight-bold" style="background: #64748b; border: none; padding: 7px 20px; border-radius: 6px;" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.showCODetailsModal = function(coNo, bookingNo) {
            const targetKey = coNo || bookingNo;
            if (!targetKey) {
                alert("Challan order details not found.");
                return;
            }

            const modalBody = document.getElementById("coDetailsModalBody");
            const modalTitle = document.getElementById("coDetailsModalTitle");
            modalTitle.textContent = "Challan Order Details";
            modalBody.innerHTML = `<div class="text-center text-muted py-4"><i class="typcn typcn-arrow-sync mr-2"></i> Loading challan order details...</div>`;
            $('#coDetailsModal').modal('show');

            fetch('/sales/challan-details/' + encodeURIComponent(targetKey))
                .then(r => r.json())
                .then(data => {
                    if (!data) {
                        modalBody.innerHTML = `<div class="text-center text-danger py-4">Challan order details not found.</div>`;
                        return;
                    }
                    modalTitle.textContent = "Challan Order Details - " + (data.salesOrderNo || coNo || targetKey);

                    let statusBadge = '<span class="badge" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; font-weight: 600; padding: 5px 12px; border-radius: 6px;">Pending</span>';
                    if (data.status === 'Delivered' || data.status === 'Reached') {
                        statusBadge = '<span class="badge" style="background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; font-weight: 600; padding: 5px 12px; border-radius: 6px;">Delivered</span>';
                    } else if (data.status === 'Partially Delivered') {
                        statusBadge = '<span class="badge" style="background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; font-weight: 600; padding: 5px 12px; border-radius: 6px;">Partially Delivered</span>';
                    }

                    const grandTotal = parseFloat(data.grandTotal || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    let html = `
                        <div class="row mb-3">
                            <div class="col-md-3 col-6 mb-2">
                                <strong style="color: #475569; font-size: 13px;">CO Number:</strong>
                                <div style="font-weight: 700; color: #4f46e5; font-size: 14px;">${data.salesOrderNo || coNo || '—'}</div>
                            </div>
                            <div class="col-md-3 col-6 mb-2">
                                <strong style="color: #475569; font-size: 13px;">Booking No:</strong>
                                <div style="font-weight: 700; color: #0f172a; font-size: 14px;">${data.bookingNo || bookingNo || '—'}</div>
                            </div>
                            <div class="col-md-3 col-6 mb-2">
                                <strong style="color: #475569; font-size: 13px;">Supplier Name:</strong>
                                <div style="font-weight: 700; color: #0f172a; font-size: 14px;">${data.supplierName || '—'}</div>
                            </div>
                            <div class="col-md-3 col-6 mb-2">
                                <strong style="color: #475569; font-size: 13px;">Order Date:</strong>
                                <div style="color: #334155; font-size: 14px;">${data.orderDate || '—'}</div>
                            </div>
                        </div>
                        <div class="row mb-3 align-items-center">
                            <div class="col-md-4 d-flex align-items-center">
                                <strong class="mr-2" style="color: #475569; font-size: 13px;">Status:</strong>
                                ${statusBadge}
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover table-bordered mb-0" style="font-size: 13.5px; border: 1px solid #e2e8f0;">
                                <thead style="background: #f8fafc; color: #475569; border-bottom: 2px solid #cbd5e1;">
                                    <tr>
                                        <th style="font-weight: 700; color: #334155; text-align: center; width: 50px;">Sl No.</th>
                                        <th style="font-weight: 700; color: #334155;">Item Code</th>
                                        <th style="font-weight: 700; color: #334155;">Item Name</th>
                                        <th style="font-weight: 700; color: #334155;">Item Type</th>
                                        <th class="text-right" style="font-weight: 700; color: #334155;">Rate (₹)</th>
                                        <th class="text-center" style="font-weight: 700; color: #334155;">Ordered Qty</th>
                                        <th class="text-center" style="font-weight: 700; color: #334155;">Delivered Qty</th>
                                        <th class="text-right" style="font-weight: 700; color: #334155;">Total Cost (₹)</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    const items = data.items || [];
                    if (items.length === 0) {
                        html += `<tr><td colspan="8" class="text-center text-muted py-3">No item details found for this order.</td></tr>`;
                    } else {
                        items.forEach((d, idx) => {
                            const rateFmt = parseFloat(d.rate || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            const costFmt = parseFloat(d.totalCost || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            html += `
                                <tr>
                                    <td class="text-center font-weight-bold" style="color: #64748b;">${idx + 1}</td>
                                    <td style="color: #334155;">${d.itemCode || 'N/A'}</td>
                                    <td style="font-weight: 700; color: #0f172a;">${d.itemName || 'N/A'}</td>
                                    <td style="color: #475569;">${d.itemType || 'N/A'}</td>
                                    <td class="text-right" style="color: #334155;">₹${rateFmt}</td>
                                    <td class="text-center" style="color: #334155;">${d.quantity || 0}</td>
                                    <td class="text-center font-weight-bold" style="color: #15803d;">${d.deliveredQty || 0}</td>
                                    <td class="text-right font-weight-bold" style="color: #0f172a;">₹${costFmt}</td>
                                </tr>
                            `;
                        });
                    }

                    html += `
                                </tbody>
                            </table>
                        </div>
                        <div class="text-right mt-3">
                            <h5 style="color: #0f172a; margin-bottom: 0;"><strong>Grand Total: </strong><span style="color: #10b981; font-weight: 700;">₹${grandTotal}</span></h5>
                        </div>
                    `;

                    modalBody.innerHTML = html;
                })
                .catch(err => {
                    console.error("Error loading CO details:", err);
                    modalBody.innerHTML = `<div class="text-center text-danger py-4">Error loading challan order details.</div>`;
                });
        };

        window.printCODetailsModal = function() {
            const printContent = document.getElementById("coDetailsModalBody").innerHTML;
            const title = document.getElementById("coDetailsModalTitle").textContent;
            const printWindow = window.open('', '', 'height=700,width=900');
            printWindow.document.write('<html><head><title>' + title + '</title>');
            printWindow.document.write('<link rel="stylesheet" href="/vendors/css/vendor.bundle.base.css">');
            printWindow.document.write('<style>body{font-family:sans-serif;padding:24px;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #cbd5e1;padding:8px 12px;} th{background:#f8fafc;} .text-right{text-align:right;} .text-center{text-align:center;} .badge{padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;display:inline-block;}</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write('<h3 style="margin-bottom:16px;">' + title + '</h3>');
            printWindow.document.write(printContent);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(function() {
                printWindow.print();
                printWindow.close();
            }, 500);
        };
    </script>
</div>

</html>
