<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">

    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                <h4 class="mb-0 text-white font-weight-bold" style="letter-spacing: 0.3px;">
                    <i class="typcn typcn-archive mr-2" style="font-size: 1.3rem; vertical-align: middle;"></i>
                    Ledger Stock Report
                </h4>
            </div>

            <div class="card-body p-4">

                <!-- Item Selector Section -->
                <div class="row align-items-end mb-4">
                    <div class="col-md-9 form-group mb-md-0 mb-3">
                        <label for="reportItemSelector" style="font-weight: 700; color: #334155; font-size: 0.9rem;">Select Item <span class="text-danger">*</span></label>
                        <select class="form-control font-weight-bold" id="reportItemSelector" style="border: 1px solid #cbd5e1; border-radius: 4px; height: 42px; color: #334155; font-size: 0.92rem;" required>
                            <option value="" selected disabled>-- Select Item --</option>
                            <option th:each="item : ${items}"
                                    th:value="${item.itemId}"
                                    th:text="${item.itemName + ' (Code: ' + item.itemCode + ', ID: ' + item.itemId + ')'}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 form-group mb-0">
                        <button type="button" class="btn text-white font-weight-bold w-100" id="viewReportItemBtn" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border: none; height: 42px; border-radius: 4px; font-size: 0.95rem; box-shadow: 0 2px 6px rgba(37,99,235,0.25);">
                            <i class="typcn typcn-eye mr-1"></i> View
                        </button>
                    </div>
                </div>

                <hr style="border-top: 1px solid #e2e8f0; margin-bottom: 25px;">

                <!-- Printable Report Content Container -->
                <div id="pdfReportContent" style="display: none;">
                    <h5 class="mb-3 font-weight-bold" style="color: #0f172a; font-size: 1.05rem;">
                        <i class="typcn typcn-th-list mr-1" style="color: #2563eb;"></i> Ledger Stock Details
                    </h5>

                    <div class="table-responsive mb-4">
                        <table class="table table-bordered mb-0" id="ledgerReportTable" style="font-size: 13.5px; border: 1px solid #cbd5e1;">
                            <thead>
                                <tr style="background: #1e293b; color: #ffffff; border-bottom: 2px solid #0f172a;">
                                    <th style="font-weight: 700; color: #ffffff; padding: 12px 16px;">Item Code</th>
                                    <th style="font-weight: 700; color: #ffffff; padding: 12px 16px;">Item Name</th>
                                    <th style="font-weight: 700; color: #ffffff; padding: 12px 16px;">Item Type</th>
                                    <th style="font-weight: 700; color: #ffffff; padding: 12px 16px;">Received</th>
                                    <th style="font-weight: 700; color: #ffffff; padding: 12px 16px;">Sent</th>
                                    <th style="font-weight: 700; color: #ffffff; padding: 12px 16px;">Balance</th>
                                </tr>
                            </thead>
                            <tbody id="ledgerReportTableBody">
                                <tr class="no-report-items-row">
                                    <td colspan="6" class="text-center text-muted py-4" style="background: #edf4fc;">
                                        Please select an item to view the report.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

                <!-- Bottom Actions / Download PDF -->
                <div id="reportActionContainer" class="mt-4 d-flex justify-content-end" style="display: none;">
                    <button type="button" class="btn text-white font-weight-bold" id="downloadPdfBtn" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: none; padding: 10px 22px; border-radius: 4px; font-size: 0.92rem; box-shadow: 0 2px 6px rgba(15,23,42,0.2);">
                        <i class="typcn typcn-document-text mr-1"></i> Download PDF
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- PDF Document Preview Modal Mini Window -->
    <div class="modal fade" id="pdfPreviewModal" tabindex="-1" role="dialog" aria-labelledby="pdfPreviewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document" style="max-width: 900px;">
            <div class="modal-content shadow-lg border-0" style="border-radius: 8px; overflow: hidden;">

                <div class="modal-header text-white" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                    <h5 class="modal-title font-weight-bold text-white mb-0" id="pdfPreviewModalLabel">
                        <i class="typcn typcn-eye mr-2" style="color: #38bdf8;"></i> Report Document Preview
                    </h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="opacity: 0.9;">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body bg-light p-4" style="max-height: 70vh; overflow-y: auto;">
                    <!-- Preview Sheet Container -->
                    <div id="modalPdfPreviewContainer" class="card p-4 shadow-sm bg-white border" style="color: #2b2b2b; border-radius: 6px;">
                        <!-- Generated preview content will be injected here -->
                    </div>
                </div>

                <div class="modal-footer bg-white py-3 px-4">
                    <button type="button" class="btn font-weight-bold" data-dismiss="modal" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 7px 18px; border-radius: 4px;">
                        <i class="typcn typcn-times mr-1"></i> Close
                    </button>
                    <button type="button" class="btn text-white font-weight-bold" id="modalPrintBtn" style="background: #334155; border: none; padding: 7px 18px; border-radius: 4px;">
                        <i class="typcn typcn-printer mr-1"></i> Print
                    </button>
                    <button type="button" class="btn text-white font-weight-bold" id="modalConfirmDownloadBtn" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border: none; padding: 7px 20px; border-radius: 4px; box-shadow: 0 2px 6px rgba(37,99,235,0.25);">
                        <i class="typcn typcn-download mr-1"></i> Confirm & Download PDF
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Include html2pdf.js for client-side PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @media print {
            .no-print, .no-print * {
                display: none !important;
            }
            .sidebar, .navbar, .card-header, #viewReportItemBtn, #reportItemSelector, .mt-4, .modal-backdrop, .modal-header, .modal-footer {
                display: none !important;
            }
            .card {
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const itemSelector = document.getElementById("reportItemSelector");
            const viewItemBtn = document.getElementById("viewReportItemBtn");
            const tableBody = document.getElementById("ledgerReportTableBody");
            const downloadPdfBtn = document.getElementById("downloadPdfBtn");
            const modalPdfPreviewContainer = document.getElementById("modalPdfPreviewContainer");
            const modalConfirmDownloadBtn = document.getElementById("modalConfirmDownloadBtn");
            const modalPrintBtn = document.getElementById("modalPrintBtn");

            function renderItemRows(data, rowIndex) {
                let tr = document.createElement("tr");
                tr.setAttribute("data-item-id", data.itemId);
                tr.style.background = "#ffffff";

                const recvVal = data.received != null ? Math.round(data.received) : 0;
                const sentVal = data.sent != null ? Math.round(data.sent) : 0;
                const balanceVal = data.stock != null ? Math.round(data.stock) : 0;

                tr.innerHTML = `
                    <td style="padding: 10px 16px; color: #334155;">${data.itemCode || 'N/A'}</td>
                    <td style="padding: 10px 16px;"><strong style="color: #0f172a;">${data.itemName || 'N/A'}</strong></td>
                    <td style="padding: 10px 16px; color: #475569;">${data.itemType || 'N/A'}</td>
                    <td style="padding: 10px 16px; color: #10b981; font-weight: bold;">${recvVal}</td>
                    <td style="padding: 10px 16px; color: #ef4444; font-weight: bold;">${sentVal}</td>
                    <td style="padding: 10px 16px; color: #2563eb; font-weight: bold;">${balanceVal}</td>
                `;
                tableBody.appendChild(tr);
                return rowIndex + 1;
            }

            const pdfReportContent = document.getElementById("pdfReportContent");
            const reportActionContainer = document.getElementById("reportActionContainer");

            function loadLedgerReport() {
                const itemId = itemSelector.value;
                tableBody.innerHTML = "";

                if (!itemId || itemId === "all") {
                    pdfReportContent.style.display = "none";
                    if (reportActionContainer) reportActionContainer.style.display = "none";
                    return;
                }

                tableBody.innerHTML = `<tr class="no-report-items-row"><td colspan="7" class="text-center text-muted py-4" style="background: #edf4fc;">Loading ledger stock details...</td></tr>`;
                pdfReportContent.style.display = "block";
                if (reportActionContainer) reportActionContainer.style.display = "flex";

                fetch("/reports/ledger-stock/details/" + itemId)
                    .then(res => res.json())
                    .then(data => {
                        tableBody.innerHTML = "";
                        if (data.error) {
                            alert(data.error);
                            pdfReportContent.style.display = "none";
                            if (reportActionContainer) reportActionContainer.style.display = "none";
                            return;
                        }
                        renderItemRows(data, 0);
                    })
                    .catch(err => {
                        console.error("Error fetching item ledger details:", err);
                        tableBody.innerHTML = `<tr class="no-report-items-row"><td colspan="7" class="text-center text-muted py-4" style="background: #f8fafc;">Error loading item ledger details.</td></tr>`;
                    });
            }

            viewItemBtn.addEventListener("click", loadLedgerReport);
            itemSelector.addEventListener("change", loadLedgerReport);

            // Open Document Preview Modal Mini Window
            downloadPdfBtn.addEventListener("click", function () {
                const rows = tableBody.querySelectorAll("tr");
                if (rows.length === 1 && rows[0].classList.contains("no-report-items-row")) {
                    alert("Please select and view an item before downloading PDF!");
                    return;
                }

                const now = new Date();
                const formattedDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

                // Clone table rows for clean preview
                let previewRowsHtml = "";
                rows.forEach(r => {
                    const cells = r.querySelectorAll("td");
                    if (cells.length >= 6) {
                        previewRowsHtml += `
                            <tr>
                                <td style="padding: 8px;">${cells[0].innerText}</td>
                                <td style="padding: 8px;"><strong>${cells[1].innerText}</strong></td>
                                <td style="padding: 8px;">${cells[2].innerText}</td>
                                <td style="padding: 8px; color: #10b981; font-weight: bold;">${cells[3].innerText}</td>
                                <td style="padding: 8px; color: #ef4444; font-weight: bold;">${cells[4].innerText}</td>
                                <td style="padding: 8px; color: #2563eb; font-weight: bold;">${cells[5].innerText}</td>
                            </tr>
                        `;
                    }
                });

                // Build Preview Sheet Document inside Modal matching standard page color theme
                modalPdfPreviewContainer.innerHTML = `
                    <div style="font-family: Arial, sans-serif;">
                        <div class="text-center mb-4 border-bottom pb-3">
                            <h3 style="color: #0f172a; font-weight: bold; margin-bottom: 5px;">Cylinder Supply Software</h3>
                            <h5 style="color: #2563eb; font-weight: 600; margin-bottom: 5px;">LEDGER STOCK REPORT</h5>
                            <span class="badge badge-light border" style="font-size: 0.85rem;">Generated On: ${formattedDate}</span>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-bordered text-center" style="font-size: 13px;">
                                <thead>
                                    <tr style="background-color: #1e293b; color: #ffffff;">
                                        <th>Item Code</th>
                                        <th>Item Name</th>
                                        <th>Item Type</th>
                                        <th>Received Quantity</th>
                                        <th>Sent Quantity</th>
                                        <th>Balance</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${previewRowsHtml}
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-between text-muted" style="font-size: 0.8rem;">
                            <span>Official Stock Movement Audit Document</span>
                            <span>Page 1 of 1</span>
                        </div>
                    </div>
                `;

                // Show Bootstrap Modal Mini Window
                if (window.$ && $('#pdfPreviewModal').modal) {
                    $('#pdfPreviewModal').modal('show');
                } else {
                    const modalEl = document.getElementById("pdfPreviewModal");
                    modalEl.classList.add("show");
                    modalEl.style.display = "block";
                    document.body.classList.add("modal-open");
                }
            });

            // Action inside Modal: Confirm & Download PDF
            modalConfirmDownloadBtn.addEventListener("click", function () {
                const opt = {
                    margin:       0.4,
                    filename:     'Ledger_Stock_Report.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
                };

                if (window.html2pdf) {
                    html2pdf().set(opt).from(modalPdfPreviewContainer).save().then(() => {
                        if (window.$ && $('#pdfPreviewModal').modal) {
                            $('#pdfPreviewModal').modal('hide');
                        }
                    }).catch(err => {
                        console.error("html2pdf error fallback to print:", err);
                        window.print();
                    });
                } else {
                    window.print();
                }
            });

            // Action inside Modal: Print Document
            modalPrintBtn.addEventListener("click", function () {
                window.print();
            });
        });
    </script>

</div>

</html>
