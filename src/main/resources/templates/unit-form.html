<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">

    <div class="col-12 grid-margin stretch-card">
        <div class="card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">

            <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 16px 24px;">
                <h4 class="mb-0 text-white font-weight-bold" style="letter-spacing: 0.3px;">
                    <i class="typcn typcn-document-add mr-2" style="font-size: 1.3rem; vertical-align: middle;"></i>
                    Unit Master Form
                </h4>
                <a th:href="@{/units}" class="btn btn-sm font-weight-bold" style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 6px;">
                    <i class="typcn typcn-arrow-left"></i> Back to List
                </a>
            </div>

            <div class="card-body p-4">

                <form class="forms-sample needs-validation"
                      th:action="@{/units/save}"
                      th:object="${unit}"
                      method="post"
                      novalidate>

                    <input type="hidden" th:field="*{unitId}">

                    <div class="row">
                        <!-- Left Column -->
                        <div class="col-md-6">
                            <!-- Unit Code -->
                            <div class="form-group row align-items-center mb-3">
                                <label for="unitCode" class="col-4 col-form-label font-weight-bold text-dark" style="font-size: 13.5px;">Unit Code <span class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="text" class="form-control form-control-sm font-weight-bold" style="border: 1px solid #cbd5e1; border-radius: 6px;" id="unitCode" th:field="*{unitCode}" placeholder="Enter Unit Code" required>
                                    <div class="invalid-feedback">Please provide a valid Unit Code.</div>
                                </div>
                            </div>

                            <!-- Unit Type -->
                            <div class="form-group row align-items-center mb-3">
                                <label for="unitType" class="col-4 col-form-label font-weight-bold text-dark" style="font-size: 13.5px;">Unit Type <span class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="text" class="form-control form-control-sm font-weight-bold" style="border: 1px solid #cbd5e1; border-radius: 6px;" id="unitType" th:field="*{unitType}" placeholder="Enter Unit Type" required>
                                    <div class="invalid-feedback">Please provide a valid Unit Type.</div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="col-md-6">
                            <!-- Unit Name -->
                            <div class="form-group row align-items-center mb-3">
                                <label for="unitName" class="col-4 col-form-label font-weight-bold text-dark" style="font-size: 13.5px;">Unit Name <span class="text-danger">*</span></label>
                                <div class="col-8">
                                    <input type="text" class="form-control form-control-sm font-weight-bold" style="border: 1px solid #cbd5e1; border-radius: 6px;" id="unitName" th:field="*{unitName}" placeholder="Enter Unit Name" required>
                                    <div class="invalid-feedback">Please provide a valid Unit Name.</div>
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="form-group row align-items-center mb-3">
                                <label for="isValid" class="col-4 col-form-label font-weight-bold text-dark" style="font-size: 13.5px;">Status</label>
                                <div class="col-8">
                                    <select class="form-control form-control-sm font-weight-bold" style="border: 1px solid #cbd5e1; border-radius: 6px;" id="isValid" th:field="*{isValid}">
                                        <option value="1">Active</option>
                                        <option value="0">Inactive</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex align-items-center pt-2">
                        <button type="submit" class="btn text-white font-weight-bold mr-2" style="background: #10b981; border: none; padding: 9px 20px; border-radius: 6px; box-shadow: 0 2px 4px rgba(16,185,129,0.25);">
                            <i class="typcn typcn-tick"></i> Save
                        </button>

                        <a th:href="@{/units}" class="btn text-white font-weight-bold mr-2" style="background: #64748b; border: none; padding: 9px 20px; border-radius: 6px;">
                            <i class="typcn typcn-arrow-left"></i> Back to List
                        </a>

                        <button type="reset" class="btn font-weight-bold" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 9px 20px; border-radius: 6px;" th:if="*{unitId == null}">
                            Reset
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

    <!-- Client-side validation logic -->
    <script>
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.getElementsByClassName('needs-validation');
                var validation = Array.prototype.filter.call(forms, function (form) {
                    form.addEventListener('submit', function (event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>

</div>

</html>
